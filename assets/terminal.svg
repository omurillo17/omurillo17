<svg width="900" height="480" viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#100d19"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="tGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 0) scale(500 260)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tClip">
      <rect x="0" y="0" width="900" height="480" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tClip)">
    <rect width="900" height="480" fill="url(#tBg)"/>
    <rect width="900" height="480" fill="url(#tGlow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="44" fill="#110d1c"/>
    <line x1="0" y1="44" x2="900" y2="44" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="26" cy="22" r="6" fill="none" stroke="#4b4560" stroke-width="1.4"/>
    <circle cx="48" cy="22" r="6" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
    <circle cx="70" cy="22" r="6" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.4"/>
    <text x="450" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#8a86a3" letter-spacing="1">geronimo@seventeen-corp: ~/profile</text>

    <!-- body -->
    <g font-family="'Courier New', monospace" font-size="18">
      <text x="30" y="90"><tspan fill="#8B5CF6">geronimo</tspan><tspan fill="#5f5a75">@seventeen-corp</tspan><tspan fill="#5f5a75">:~$ </tspan><tspan fill="#f2f0f8">whoami</tspan></text>
      <text x="30" y="120" fill="#c4b5fd">&gt; Gerónimo Murillo — Full Stack Developer</text>

      <text x="30" y="165"><tspan fill="#8B5CF6">geronimo</tspan><tspan fill="#5f5a75">@seventeen-corp</tspan><tspan fill="#5f5a75">:~$ </tspan><tspan fill="#f2f0f8">cat os.info</tspan></text>
      <text x="30" y="195" fill="#e5e2f0">&gt; Linux — daily driver, terminal-first workflow</text>

      <text x="30" y="240"><tspan fill="#8B5CF6">geronimo</tspan><tspan fill="#5f5a75">@seventeen-corp</tspan><tspan fill="#5f5a75">:~$ </tspan><tspan fill="#f2f0f8">python manage.py runserver</tspan></text>
      <text x="30" y="270" fill="#e5e2f0">&gt; Django backend — models, APIs, PostgreSQL</text>

      <text x="30" y="315"><tspan fill="#8B5CF6">geronimo</tspan><tspan fill="#5f5a75">@seventeen-corp</tspan><tspan fill="#5f5a75">:~$ </tspan><tspan fill="#f2f0f8">next dev</tspan></text>
      <text x="30" y="345" fill="#e5e2f0">&gt; Next.js frontend — React, TypeScript, Tailwind CSS</text>

      <text x="30" y="390"><tspan fill="#8B5CF6">geronimo</tspan><tspan fill="#5f5a75">@seventeen-corp</tspan><tspan fill="#5f5a75">:~$ </tspan><tspan fill="#f2f0f8">n8n start --automate</tspan></text>
      <text x="30" y="420" fill="#e5e2f0">&gt; Workflow automation with n8n + AI — deployed via Docker</text>

      <rect x="30" y="432" width="12" height="20" fill="#8B5CF6">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="478.5" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
